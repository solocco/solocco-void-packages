name: Build Packages

on:
  push:
    branches:
      - main
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build (lihat packages.json untuk daftar lengkap / "all")'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write

concurrency: release-publish-${{ github.ref }}

jobs:
  setup:
    name: Load package list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      changed_pkgs: ${{ steps.changed.outputs.list }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Perlu history dua sisi biar bisa diff before..after seluruh
          # commit dalam push (bukan cuma HEAD).
          fetch-depth: 0

      - name: Generate matrix
        id: set
        run: |
          matrix=$(jq -c '{include: [.packages[] | select(.build != false)]}' packages.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Detect changed packages
        id: changed
        if: github.event_name == 'push'
        run: |
          # FIX: sebelumnya filter di job build cuma cek pesan commit HEAD
          # (`echo "$MSG" | grep -qF "$PKG"`). Bikin update template kelewat
          # kalau: push isinya banyak commit (cuma HEAD yang diperiksa),
          # HEAD-nya merge commit tanpa nama pkg, pesan commit tidak sebut
          # nama pkg secara literal, atau nama pkg jadi substring nama pkg
          # lain (grep -F, bukan word boundary).
          # Sekarang: deteksi berdasarkan file yang benar-benar berubah di
          # bawah srcpkgs/<pkg>/ pada RANGE commit yang di-push.
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            # Branch baru / force-push / before-commit tidak ada di local:
            # fallback ke file yang berubah di HEAD saja.
            echo "Fallback: diff terhadap HEAD saja"
            files=$(git show --name-only --format= "${AFTER:-HEAD}" -- 'srcpkgs/*' 2>/dev/null || true)
          else
            echo "Range: $BEFORE..$AFTER"
            files=$(git diff --name-only "$BEFORE" "$AFTER" -- 'srcpkgs/*')
          fi
          list=$(printf '%s\n' "$files" \
            | awk -F/ 'NF>=2 && $1=="srcpkgs" {print $2}' \
            | sort -u \
            | tr '\n' ' ')
          echo "Changed packages: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }}
    needs: setup
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: x86_64
        BOOTSTRAP: x86_64
        TEST: 0

    steps:
      - name: Check if this package should be built
        id: filter
        shell: sh
        run: |
          PKG="${{ matrix.package }}"
          EVENT="${{ github.event_name }}"
          INPUT="${{ github.event.inputs.package }}"
          CHANGED="${{ needs.setup.outputs.changed_pkgs }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$INPUT" = "$PKG" ] || [ "$INPUT" = "all" ]; then
              echo "run=true" >> $GITHUB_OUTPUT
            else
              echo "run=false" >> $GITHUB_OUTPUT
            fi
          elif [ "$EVENT" = "push" ]; then
            # Daftar package yang berubah dikomputasi di job setup dari
            # `git diff` seluruh commit dalam push (before..after) --
            # nama pkg persis (word-boundary via spasi pembatas), bukan
            # substring, dan tidak tergantung pesan commit sama sekali.
            case " $CHANGED " in
              *" $PKG "*) echo "run=true" >> $GITHUB_OUTPUT ;;
              *)          echo "run=false" >> $GITHUB_OUTPUT ;;
            esac
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare container
        if: steps.filter.outputs.run == 'true'
        run: |
          # FIX: sebelumnya `xbps-install -Syu xbps && xbps-install -yu && xbps-install -y ...`
          # rentan ke reposync 404 dari repo-ci.voidlinux.org (upstream void CI
          # mirror kadang balesin 404 di x86_64-repodata). Kalau step pertama
          # gagal, chain `&&` bikin `xbps-install -y ... curl ...` gak jalan,
          # dan baris `curl ... gh_...tar.gz | tar ...` di bawah mati dengan
          # "curl: not found" -> job Prepare container gagal -> build/publish
          # ga jalan walaupun cuma flake sesaat.
          # Sekarang: fallback otomatis ke repo-default (mirror publik void)
          # kalau bootstrap via repo-ci gagal, plus retry download gh CLI.
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          bootstrap_xbps() {
            xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash curl git
          }
          if ! bootstrap_xbps; then
            echo "::warning::repo-ci gagal, fallback ke repo-default"
            sed -i 's|repo-ci|repo-default|g' /etc/xbps.d/*-repository-*.conf
            bootstrap_xbps
          fi
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL \
            https://github.com/cli/cli/releases/download/v2.67.0/gh_2.67.0_linux_amd64.tar.gz \
            | tar -xz -C /tmp
          install -m755 /tmp/gh_2.67.0_linux_amd64/bin/gh /usr/local/bin/gh
          useradd -G xbuilder -M builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: Checkout repo
        if: steps.filter.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout void-packages
        if: steps.filter.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: void-linux/void-packages
          path: void-packages

      - name: Merge template
        if: steps.filter.outputs.run == 'true'
        run: |
          # FIX: sebelumnya cuma copy folder matrix.package sendiri:
          #   cp -rv main-repo/srcpkgs/${{ matrix.package }} void-packages/srcpkgs/
          # Masalahnya, kalau package lain (mis. scenefx) juga punya versi
          # custom di repo ini tapi lagi bukan giliran build-nya, xbps-src
          # bakal ambil versi LAMA dari upstream void-packages pas resolve
          # makedepends package yang lagi di-build (mis. mangowc butuh
          # scenefx-devel >= 0.5, tapi upstream masih di 0.4).
          # Copy SEMUA srcpkgs custom kita supaya konsisten di semua job
          # matrix, apapun package yang lagi giliran build.
          cp -rv main-repo/srcpkgs/. void-packages/srcpkgs/
          chown -R builder:builder void-packages

      - name: Prepare masterdir
        if: steps.filter.outputs.run == 'true'
        run: |
          cd void-packages
          sudo -Eu builder common/travis/set_mirror.sh
          sudo -Eu builder common/travis/prepare.sh
          common/travis/fetch-xtools.sh

      - name: Patch shlibs (pending upstream PR)
        if: steps.filter.outputs.run == 'true'
        run: |
          cd void-packages
          # scenefx 0.5 belum di-merge upstream (PR void-linux/void-packages#61453),
          # jadi common/shlibs upstream masih mentok di soname 0.4. Tambahin
          # manual biar xbps-src ngenalin shlib-provides scenefx 0.5.
          # FIX: dipindah ke SETELAH "Prepare masterdir" -- common/travis/prepare.sh
          # kemungkinan ngelakuin git clean/reset di repo void-packages, yang
          # bakal ngapus modifikasi uncommitted kita kalau patch dilakuin
          # SEBELUM step itu. Jadi ini harus jadi hal terakhir yang nyentuh
          # void-packages sebelum xbps-src pkg dipanggil.
          # Idempotent: kalau PR-nya udah landing di upstream, grep bakal
          # match dan sed di-skip, gak akan dobel-entry.
          grep -qxF 'libscenefx-0.5.so scenefx-0.5_1' common/shlibs || \
            sed -i '/^libscenefx-0.4.so /a libscenefx-0.5.so scenefx-0.5_1' common/shlibs
          echo "--- shlibs entry buat scenefx (verifikasi patch nempel) ---"
          grep -F 'libscenefx-0.5.so' common/shlibs

      - name: Enable restricted packages
        if: steps.filter.outputs.run == 'true' && matrix.restricted == true
        run: |
          mkdir -p void-packages/common/conf
          echo "XBPS_ALLOW_RESTRICTED=yes" | sudo tee -a void-packages/common/conf/make.conf

      - name: Build ${{ matrix.package }}
        if: steps.filter.outputs.run == 'true'
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          cd void-packages

          max_attempts=3
          attempt=1
          until sudo -Eu builder ./xbps-src -j"$(nproc)" pkg ${{ matrix.package }}; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Build ${{ matrix.package }} gagal setelah $attempt percobaan."
              exit 1
            fi
            attempt=$((attempt + 1))
            wait_s=$((attempt * 15))
            echo "::warning::Build gagal (attempt $((attempt - 1))/$max_attempts), retry dalam ${wait_s}s..."
            sleep "$wait_s"
          done

      - name: Upload build artifacts
        if: steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pkgs-${{ matrix.package }}
          path: |
            void-packages/hostdir/binpkgs/**/*.xbps
            void-packages/hostdir/binpkgs/**/*.xbps.sig2
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish repo
    needs: [setup, build]
    # FIX: sebelumnya `if: needs.build.result == 'success'`.
    # Karena strategy.fail-fast: false, SATU paket gagal build saja membuat
    # needs.build.result == 'failure', sehingga seluruh job publish di-skip
    # walau paket lain sudah sukses build & ter-upload sebagai artifact.
    # Sekarang publish tetap jalan selama job tidak dibatalkan, dan step-step
    # di dalamnya sudah punya gate sendiri lewat steps.check.outputs.has_pkgs.
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged
      volumes:
        - /dev:/dev

    steps:
      - name: Prepare container
        run: |
          # Sama seperti Prepare container di job build: fallback ke
          # repo-default kalau bootstrap via repo-ci gagal (mis. reposync
          # 404), supaya publish gak mati gara-gara flake sesaat di
          # upstream mirror.
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          bootstrap_xbps() {
            xbps-install -Syu xbps && xbps-install -yu && xbps-install -y curl
          }
          if ! bootstrap_xbps; then
            echo "::warning::repo-ci gagal, fallback ke repo-default"
            sed -i 's|repo-ci|repo-default|g' /etc/xbps.d/*-repository-*.conf
            bootstrap_xbps
          fi
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL \
            https://github.com/cli/cli/releases/download/v2.67.0/gh_2.67.0_linux_amd64.tar.gz \
            | tar -xz -C /tmp
          install -m755 /tmp/gh_2.67.0_linux_amd64/bin/gh /usr/local/bin/gh

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkgs-*
          path: /tmp/new-pkgs
          merge-multiple: true

      - name: Check if any packages were built
        id: check
        run: |
          if find /tmp/new-pkgs -name "*.xbps" 2>/dev/null | grep -q .; then
            echo "has_pkgs=true" >> $GITHUB_OUTPUT
          else
            echo "has_pkgs=false" >> $GITHUB_OUTPUT
            echo "No new packages built, nothing to publish."
          fi

      - name: Get list of built package names
        if: steps.check.outputs.has_pkgs == 'true'
        id: built-pkgs
        run: |
          # Ekstrak nama dasar paket dari file .xbps (sebelum versi)
          built=$(find /tmp/new-pkgs -name '*.xbps' -exec basename {} \; | sed 's/-[0-9].*//' | sort -u | tr '\n' ' ')
          echo "list=$built" >> $GITHUB_OUTPUT
          echo "Built packages: $built"

      - name: Download existing repo from release
        if: steps.check.outputs.has_pkgs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/repo
          gh release download repo-latest \
            --repo ${{ github.repository }} \
            --dir /tmp/repo \
            --pattern "*.xbps" \
            --pattern "x86_64-repodata" || echo "No existing release found, starting fresh"

      - name: Merge new packages into repo
        if: steps.check.outputs.has_pkgs == 'true'
        run: |
          find /tmp/new-pkgs -name "*.xbps" -exec cp -f {} /tmp/repo/ \;

      - name: Cleanup old versions from local repo dir
        if: steps.check.outputs.has_pkgs == 'true'
        env:
          PKG_LIST: ${{ steps.built-pkgs.outputs.list }}
        run: |
          cd /tmp/repo
          for pkg in $PKG_LIST; do
            # Hapus semua versi kecuali yang paling baru (berdasarkan sort -V)
            ls ${pkg}-[0-9]*.xbps 2>/dev/null | sort -Vr | tail -n +2 | xargs -r rm -f
          done

      - name: Sign and index
        if: steps.check.outputs.has_pkgs == 'true'
        env:
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          cd /tmp/repo
          rm -f x86_64-repodata *.xbps.sig2
          trap 'rm -f private.pem' EXIT
          echo "$PRIV_KEY" > private.pem
          xbps-rindex -a *.xbps
          xbps-rindex -s --signedby "solocco" --privkey private.pem $PWD
          xbps-rindex -S --privkey private.pem *.xbps

      - name: Ensure release exists
        if: steps.check.outputs.has_pkgs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create repo-latest \
            --repo ${{ github.repository }} \
            --title "solocco-void-packages" \
            --notes "Permanent repository release. Files are updated automatically on each build." \
            --latest 2>/dev/null || true

      - name: Delete old package assets from release
        if: steps.check.outputs.has_pkgs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_LIST: ${{ steps.built-pkgs.outputs.list }}
        run: |
          for pkg in $PKG_LIST; do
            # FIX: sebelumnya `grep "^${pkg}-[0-9].*\.(xbps|xbps\.sig2)$"` tanpa -E.
            # Tanpa -E, grep pakai BRE dimana ( ) | adalah karakter literal,
            # bukan alternation/group. Jadi pattern lama tidak pernah match
            # nama file asli sama sekali -> asset lama TIDAK PERNAH terhapus
            # dan terus menumpuk di release setiap build. Sekarang pakai -E.
            gh release view repo-latest \
              --repo ${{ github.repository }} \
              --json assets \
              --jq ".assets[].name" 2>/dev/null \
            | grep -E "^${pkg}-[0-9].*\.(xbps|xbps\.sig2)$" \
            | while read -r asset; do
                echo "Deleting old asset: $asset"
                gh release delete-asset repo-latest "$asset" \
                  --repo ${{ github.repository }} -y || true
              done
          done

      - name: Upload to permanent release
        if: steps.check.outputs.has_pkgs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in /tmp/repo/*; do
            gh release upload repo-latest \
              --repo ${{ github.repository }} \
              --clobber \
              "$f" || true
          done

      - name: Notify sukses ke Telegram
        # Cuma kirim kalau publish sukses DAN ada paket baru yang beneran
        # di-upload (has_pkgs). success() eksplisit karena begitu ada `if:`,
        # cek sukses default step-nya hilang.
        if: ${{ success() && steps.check.outputs.has_pkgs == 'true' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::Secret Telegram belum diset, skip notifikasi."
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Daftar paket baru sebagai "nama-versi_revisi" dari file .xbps yang
          # barusan dibangun (buang sufiks .<arch>.xbps). Termasuk subpackage.
          bullets=$(find /tmp/new-pkgs -name '*.xbps' -exec basename {} \; \
                    | sed -E 's/\.[^.]+\.xbps$//' | sort -u | sed 's/^/• /')
          # Escape untuk HTML parse_mode Telegram.
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          bullets=$(esc "$bullets")
          text=$(printf '%s\n\n%s\n%s\n\n%s\n%s' \
            "✅ <b>Repo void diperbarui</b>" \
            "Paket baru:" \
            "$bullets" \
            "Update: <code>sudo xbps-install -Su</code>" \
            "$run_url")
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${text}"

  notify:
    name: Notify on failure
    needs: [setup, build, publish]
    # Jalan hanya kalau ada job di atas yang GAGAL (bukan sekadar di-cancel).
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Kirim notifikasi Telegram
        env:
          # COMMIT_MSG lewat env (bukan interpolasi ${{ }} langsung di script)
          # supaya pesan commit tidak bisa jadi shell injection.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::Secret TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID belum diset, skip notifikasi."
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Escape karakter yang punya arti khusus di HTML parse_mode Telegram.
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          text="🔴 <b>Build Packages GAGAL</b>"
          text="${text}$(printf '\nRepo: %s' "$(esc "$GITHUB_REPOSITORY")")"
          if [ -n "${COMMIT_MSG:-}" ]; then
            text="${text}$(printf '\nCommit: %s' "$(esc "$(printf '%s' "$COMMIT_MSG" | head -n1)")")"
          fi
          text="${text}$(printf '\n%s' "$run_url")"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${text}"
