name: Reconcile builds

# Nutup celah: build.yml cuma ke-trigger kalau ada perubahan file di
# srcpkgs/**. Kalau template udah versi terbaru tapi build-nya gagal (dep
# belum kebuild, flake, repo-ci down, run kebatalan concurrency), gak ada
# yang nge-trigger ulang tanpa harus bump revision manual.
#
# Workflow ini bandingin "apa yang template minta" (version_revision) vs
# "apa yang bener-bener kepublish" di release repo-latest. Package build:true
# yang binary-nya belum nangkring = belum kebuild -> auto-dispatch build.yml
# buat package-package itu (SATU dispatch, daftar spasi-pisah, biar gak saling
# batalin di concurrency group). Otomatis berhenti begitu binary-nya masuk.

on:
  workflow_dispatch:
  schedule:
    # 00:30 UTC (07:30 WIB), ~30 menit sesudah Update Check (00:00) supaya
    # template versi baru udah ter-push duluan.
    - cron: '30 0 * * *'

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    name: Reconcile published vs template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find packages missing from repo
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Daftar aset xbps yang udah kepublish. Kalau release belum ada,
          # anggap kosong (semua package bakal kehitung missing).
          assets=$(mktemp)
          gh release view repo-latest \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name' > "$assets" 2>/dev/null || : > "$assets"

          missing=""
          while read -r pkg_json; do
            pkg=$(echo "$pkg_json" | jq -r '.package')
            tpl="srcpkgs/${pkg}/template"
            if [ ! -f "$tpl" ]; then
              echo "::warning::template $pkg gak ada, skip."
              continue
            fi
            ver=$(grep -m1 '^version=' "$tpl" | cut -d= -f2 | tr -d '"')
            rev=$(grep -m1 '^revision=' "$tpl" | cut -d= -f2 | tr -d '"')
            # Prefix diakhiri titik biar revision persis: "pkg-1.2_1." gak
            # ke-match sama "pkg-1.2_10.x86_64.xbps".
            prefix="${pkg}-${ver}_${rev}."
            if grep -qF "$prefix" "$assets"; then
              echo "OK       $pkg ${ver}_${rev}"
            else
              echo "MISSING  $pkg ${ver}_${rev}"
              missing="$missing $pkg"
            fi
          done <<EOF
          $(jq -c '.packages[] | select(.build != false)' packages.json)
          EOF

          missing=$(echo "$missing" | xargs || true)
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

          {
            echo "## Reconcile"
            if [ -n "$missing" ]; then
              echo "Package belum kepublish (di-dispatch rebuild):"
              for p in $missing; do echo "- \`$p\`"; done
            else
              echo "Semua package build:true udah kepublish sesuai template. Gak ada yang perlu di-rebuild."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch build for missing packages
        if: steps.scan.outputs.missing != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISSING: ${{ steps.scan.outputs.missing }}
        run: |
          # SATU dispatch dengan daftar package (build.yml filter nerima
          # daftar spasi-pisah). Dispatch per-package bakal saling dibatalkan
          # di concurrency group release-publish-main.
          echo "Dispatch rebuild buat: $MISSING"
          gh workflow run build.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f package="$MISSING"

  shlib-rebuild:
    name: Rebuild broken-shlib packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged
      volumes:
        - /dev:/dev
    steps:
      # Deteksi package yang binary-nya udah kepublish & versi terbaru TAPI
      # rusak karena shlib gak resolvable lagi (mis. void bump Qt: pcsx2 /
      # quickshell-bin yang kelink Qt private API jadi "broken, unresolvable
      # shlib"). Reconcile gak nangkep ini (versinya udah kepublish); di sini
      # kita reproduksi gejalanya via dry-run install, lalu BUMP REVISION +
      # rebuild. Bump wajib supaya pkgver berubah dan client beneran upgrade
      # ke binary yang udah di-relink (rebuild diam-diam dengan pkgver sama
      # gak akan ditarik xbps).
      - name: Prepare container
        run: |
          # Bootstrap sama kayak build.yml (repo-ci + fallback repo-default)
          # supaya cek shlib pakai set repo yang SAMA dengan yang dipakai
          # build -- kalau broken di sini, rebuild bakal beneran mecahin.
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          bootstrap() { xbps-install -Syu xbps && xbps-install -yu && xbps-install -y curl git jq; }
          if ! bootstrap; then
            echo "::warning::repo-ci gagal, fallback ke repo-default"
            sed -i 's|repo-ci|repo-default|g' /etc/xbps.d/*-repository-*.conf
            bootstrap
          fi
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL \
            https://github.com/cli/cli/releases/download/v2.67.0/gh_2.67.0_linux_amd64.tar.gz \
            | tar -xz -C /tmp
          install -m755 /tmp/gh_2.67.0_linux_amd64/bin/gh /usr/local/bin/gh

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Detect broken-shlib packages
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          # Tambah repo solocco (tempat binary kita) lalu sync. `yes |` buat
          # auto-import RSA key repo secara non-interaktif.
          echo "repository=https://github.com/${GITHUB_REPOSITORY}/releases/download/repo-latest" \
            > /etc/xbps.d/10-solocco.conf
          yes | xbps-install -S >/tmp/sync.log 2>&1 || true

          # Aset yang udah kepublish (buat guard anti double-bump).
          assets=$(gh release view repo-latest --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)

          bumped=""
          for pkg in $(jq -r '.packages[] | select(.build != false) | .package' packages.json); do
            tmpl="srcpkgs/${pkg}/template"
            [ -f "$tmpl" ] || continue
            # Dry-run install: kalau shlib gak resolvable, xbps cetak
            # "<pkg>-<ver>_<rev>: broken, unresolvable shlib '...'".
            out=$(xbps-install -Sn "$pkg" 2>&1 || true)
            echo "$out" | grep -qi 'unresolvable shlib' || continue

            # Pastikan yang broken emang package KITA (bukan cuma dep).
            echo "$out" | grep -i 'unresolvable shlib' \
              | grep -qE "^${pkg}-[0-9]" || {
                echo "$pkg: ada shlib break tapi bukan di package ini, skip."
                continue
              }

            ver=$(grep -m1 '^version=' "$tmpl" | cut -d= -f2 | tr -d '"')
            rev=$(grep -m1 '^revision=' "$tmpl" | cut -d= -f2 | tr -d '"')
            # Guard anti double-bump: kalau template ver_rev BELUM kepublish,
            # berarti rebuild sebelumnya masih pending -- jangan bump lagi.
            if ! printf '%s\n' "$assets" | grep -qF "${pkg}-${ver}_${rev}."; then
              echo "$pkg: broken tapi ${ver}_${rev} belum kepublish (rebuild pending), skip."
              continue
            fi

            newrev=$((rev + 1))
            sed -i "s/^revision=.*/revision=${newrev}/" "$tmpl"
            echo "$pkg: broken shlib -> bump revision ${rev} -> ${newrev}"
            bumped="$bumped $pkg"
          done

          bumped=$(echo "$bumped" | xargs || true)
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"
          {
            echo "## Shlib rebuild"
            if [ -n "$bumped" ]; then
              echo "Package broken-shlib, revision di-bump + rebuild:"
              for p in $bumped; do echo "- \`$p\`"; done
            else
              echo "Gak ada package yang broken shlib. Semua sehat."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push bumps
        if: steps.detect.outputs.bumped != ''
        env:
          BUMPED: ${{ steps.detect.outputs.bumped }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- srcpkgs/*/template
          git commit -m "ci: bump revision untuk rebuild broken shlib (${BUMPED})" \
                     -m "Binary kepublish tapi shlib gak resolvable lagi (mis. void bump Qt). Revision di-bump supaya rebuild lawan void terkini + client narik binary baru. Otomatis dari workflow."
          for i in 1 2 3 4; do
            git push origin HEAD:main && break
            echo "push gagal, retry ($i)..."; sleep $((i * 2))
            git pull --rebase origin main || true
          done

      - name: Re-dispatch build for bumped packages
        if: steps.detect.outputs.bumped != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMPED: ${{ steps.detect.outputs.bumped }}
        run: |
          # Push via GITHUB_TOKEN gak nge-trigger build (anti-rekursi), jadi
          # dispatch manual. Satu dispatch dengan daftar package.
          echo "Dispatch rebuild buat: $BUMPED"
          gh workflow run build.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f package="$BUMPED"

  hygiene:
    name: Repo hygiene report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Scan for orphans & redundant overrides
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export LC_ALL=C

          # --- Published base package names (strip version + arch + .xbps) ---
          pub=$(gh release view repo-latest --repo "${GITHUB_REPOSITORY}" \
                  --json assets --jq '.assets[].name' 2>/dev/null \
                | grep '\.xbps$' | sed 's/-[0-9].*//' | sort -u || true)

          # --- Expected names: every package + its subpackages (*_package()) ---
          expected=""
          for pkg in $(jq -r '.packages[].package' packages.json); do
            expected="$expected $pkg"
            t="srcpkgs/${pkg}/template"
            [ -f "$t" ] && expected="$expected $(grep -oE '^[A-Za-z0-9._+-]+_package\(\)' "$t" | sed 's/_package()//' | xargs)"
          done

          # --- Orphans: published but not expected (removed/renamed packages) ---
          orphans=""
          for b in $pub; do
            [ -n "$b" ] || continue
            case " $expected " in *" $b "*) ;; *) orphans="$orphans $b";; esac
          done
          orphans=$(echo "$orphans" | xargs || true)

          # --- Redundant overrides: packages tagged override_of where Void has
          #     caught up (Void version >= ours) so our stopgap can be dropped ---
          redundant=""
          while read -r row; do
            [ -n "$row" ] || continue
            pkg=$(echo "$row" | jq -r '.package')
            vpkg=$(echo "$row" | jq -r '.override_of')
            t="srcpkgs/${pkg}/template"
            [ -f "$t" ] || continue
            our=$(grep -m1 '^version=' "$t" | cut -d= -f2 | tr -d '"')
            vt=$(curl -fsSL "https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/${vpkg}/template" 2>/dev/null || true)
            [ -n "$vt" ] || continue
            vver=$(printf '%s\n' "$vt" | grep -m1 '^version=' | cut -d= -f2 | tr -d '"')
            [ -n "$vver" ] || continue
            min=$(printf '%s\n%s\n' "$our" "$vver" | sort -V | head -1)
            if [ "$min" = "$our" ]; then
              redundant="${redundant}${pkg}\t${vpkg}\t${vver}\t${our}\n"
            fi
          done <<EOF
          $(jq -c '.packages[] | select(.override_of != null)' packages.json)
          EOF
          redundant=$(printf '%b' "$redundant")

          # --- Step summary (always) ---
          {
            echo "## Repo hygiene"
            if [ -z "$orphans" ] && [ -z "$redundant" ]; then
              echo "Clean. No orphan assets, no redundant overrides."
            else
              if [ -n "$orphans" ]; then
                echo "### Orphan assets (in repo, not in packages.json)"
                for o in $orphans; do echo "- \`$o\`"; done
              fi
              if [ -n "$redundant" ]; then
                echo "### Redundant overrides (Void caught up)"
                printf '%s\n' "$redundant" | while IFS="$(printf '\t')" read -r p vp vv ov; do
                  [ -n "$p" ] && echo "- \`$p\` — Void ships \`$vp\` $vv (>= $ov)"
                done
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # --- Build Telegram HTML body (only if there are findings) ---
          if [ -z "$orphans" ] && [ -z "$redundant" ]; then
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            echo "Repo clean."
            exit 0
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          nl=$(printf '\nx'); nl=${nl%x}
          body="🧹 <b>Repo hygiene</b>"
          if [ -n "$orphans" ]; then
            body="${body}${nl}${nl}<b>Orphan assets</b> — in the repo but not in packages.json"
            for o in $orphans; do body="${body}${nl}• <code>${o}</code>"; done
            body="${body}${nl}<i>Delete from the repo-latest release if no longer wanted.</i>"
          fi
          if [ -n "$redundant" ]; then
            body="${body}${nl}${nl}<b>Redundant overrides</b> — Void has caught up"
            while IFS="$(printf '\t')" read -r p vp vv ov; do
              [ -n "$p" ] || continue
              body="${body}${nl}• <code>${p}</code> → Void ships <code>${vp}</code> ${vv} (≥ ${ov})"
            done <<INNER
          $(printf '%s\n' "$redundant")
          INNER
          fi
          body="${body}${nl}${nl}<a href=\"${run_url}\">View workflow run</a>"

          # Fingerprint temuan -> buat dedup notif (lihat step cache di bawah).
          # Temuan yang sama gak bakal dinotif ulang tiap hari; cuma pas berubah.
          fp=$(printf '%s\n%s\n' "$orphans" "$redundant" | sha256sum | cut -d' ' -f1)
          {
            echo "has_findings=true"
            echo "fp=$fp"
            echo "body<<__TG_EOF__"
            echo "$body"
            echo "__TG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Check if these findings were already notified
        id: seen
        if: steps.scan.outputs.has_findings == 'true'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/hygiene-fp
          key: hygiene-notified-${{ steps.scan.outputs.fp }}
          lookup-only: true

      - name: Notify hygiene findings to Telegram
        if: steps.scan.outputs.has_findings == 'true' && steps.seen.outputs.cache-hit != 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BODY: ${{ steps.scan.outputs.body }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::Telegram secrets unset, skipping notification."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${BODY}"

      - name: Remember these findings (dedup marker)
        if: steps.scan.outputs.has_findings == 'true' && steps.seen.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp
          printf '%s\n' "${{ steps.scan.outputs.fp }}" > /tmp/hygiene-fp

      - name: Save dedup marker
        if: steps.scan.outputs.has_findings == 'true' && steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/hygiene-fp
          key: hygiene-notified-${{ steps.scan.outputs.fp }}

  notify:
    name: Notify on failure
    needs: [reconcile, shlib-rebuild, hygiene]
    # Cuma kalau job reconcile/shlib-rebuild GAGAL (mis. GH API error, dispatch
    # ditolak, container error) -- biar yang mati gak lolos diam-diam. Jalur
    # sukses (dispatch normal) TIDAK memicu notif ini.
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::Telegram secrets unset, skipping notification."
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          nl=$(printf '\nx'); nl=${nl%x}
          text="🔴 <b>Reconcile failed</b>${nl}${nl}Repo: <code>${GITHUB_REPOSITORY}</code>${nl}${nl}<a href=\"${run_url}\">View workflow run</a>"
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${text}"
